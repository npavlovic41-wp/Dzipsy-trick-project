<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stranica nije pronađena | Trubači Džipsi Trik</title>
    <link rel="icon" type="image/x-icon" href="/images/icon-dzipsi-trik.ico">
    <meta name="description" content="Tražena stranica nije pronađena. Vratite se na početnu i nastavite sa planiranjem vašeg savršenog slavlja.">
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="style.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cormorant Garamond', serif;
            background-color: #fafaf8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .error-container {
            max-width: 600px;
            padding: 40px 20px;
        }
        .error-icon {
            font-size: 5rem;
            color: #d4af37;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #333;
            margin-bottom: 15px;
        }
        p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-home {
            display: inline-block;
            background: #d4af37;
            color: white;
            padding: 14px 35px;
            border-radius: 6px;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .btn-home:hover {
            background: #b38a2c;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <i class="fas fa-drum error-icon"></i>
        <h1>404 – Nema muzike ovde</h1>
        <p>
            Nažalost, stranica koju tražite ne postoji.<br>
            Ali veselje ne mora da stane! Vratite se na početnu i nastavite da planirate svoje savršeno slavlje.
        </p>
        <a href="index.html" class="btn-home">
            <i class="fas fa-home"></i> Vrati me na početnu
        </a>
    </div>
</body>
</html>
